---
layout: default
title: "Contact Us - Omnitryx Inc."
permalink: /contact/
---

<main>
<section class="contact-section">
  <div class="container">
    <h1 id="contact-title">Contact Us</h1>
    <p id="contact-desc">
      Tell us about your project or inquiry. We review every message and reply within 24-48 hours. No commitment required to get in touch.
    </p>

    <form action="https://forms.omnitryx.ca/contact" method="POST" class="contact-form">
      <input type="hidden" name="client" value="omnitryx">
      <input type="hidden" name="form_type" value="contact">
      <input type="hidden" name="service" id="service-input" value="">

      <label>Your Name</label>
      <input type="text" name="name" placeholder="John Doe" required />

      <label>Your Email</label>
      <input type="email" name="email" placeholder="you@example.com" required />

      <label>Message</label>
      <textarea name="message" id="message-field" rows="5" placeholder="How can we assist you?" required></textarea>

      <button type="submit" class="btn primary">Send Message</button>
    </form>

    <div id="form-success" class="form-success-message" style="display:none;">
      Your request has been received and our team will contact you shortly.
    </div>

  </div>
</section>
</main>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var service = params.get('service');
  if (service) {
    var titleEl = document.getElementById('contact-title');
    var descEl = document.getElementById('contact-desc');
    var messageField = document.getElementById('message-field');
    var serviceInput = document.getElementById('service-input');
    if (titleEl) titleEl.textContent = 'Start a Project';
    if (descEl) descEl.textContent = 'You\'re inquiring about: ' + service + '. Fill out the form below and we will reach out within 24-48 hours to discuss your project.';
    if (serviceInput) serviceInput.value = service;
    if (messageField) messageField.value = 'I\'m interested in the ' + service + ' service.\n\nProject details:\n';
  }
})();

document.querySelector('.contact-form').addEventListener('submit', async function(e) {
  e.preventDefault(); // stop default form submission

  const formData = Object.fromEntries(new FormData(this).entries());

  try {
    const response = await fetch(this.action, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(formData)
    });

    const result = await response.json();

    if (result.success) {
      this.style.display = 'none'; // hide the form
      document.getElementById('form-success').style.display = 'block'; // show success message
    } else {
      alert('Error: ' + result.error); // only show error
    }
  } catch (err) {
    alert('Submission failed. Please try again later.');
  }
});
</script>
